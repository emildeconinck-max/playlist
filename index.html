<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Playlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#D9D9D9;
  --ink:#111;
  --muted:#6E6E73;
  --placeholder:#9A9A9F;
  --green:#34C759;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro",Inter,"Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:17px/22px var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:var(--ink);border:0;background:none;outline:none;min-width:0}
[hidden]{display:none!important}

/* ===== Liquid glass material =====
   Layer 1 (element): tint + backdrop blur, or real refraction in Chromium (set by JS)
   Layer 2 (::before): specular rim, brighter where the light hits (top-left)
   Layer 3 (::after):  pointer-following highlight on interactive glass            */
.glass{
  --tint:rgba(255,255,255,.34);
  --rim-a:rgba(255,255,255,.95);
  --rim-b:rgba(255,255,255,.18);
  --mx:30%;--my:0%;
  position:relative;isolation:isolate;
  background:
    linear-gradient(180deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,0) 55%),
    var(--tint);
  -webkit-backdrop-filter:blur(8px) saturate(1.8) brightness(1.06);
  backdrop-filter:blur(8px) saturate(1.8) brightness(1.06);
  box-shadow:
    inset 0 -1px 1.5px rgba(0,0,0,.06),            /* lower inner edge */
    inset 0 0 12px rgba(255,255,255,.35),           /* inner glow */
    0 0 0 .5px rgba(0,0,0,.16),                     /* hairline */
    0 1px 2px rgba(0,0,0,.08),
    0 8px 18px -4px rgba(0,0,0,.14);                /* soft lift, like the Figma drop shadow */
}
.glass::before{ /* specular rim */
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:1;
  background:linear-gradient(155deg,var(--rim-a) 0%,var(--rim-b) 38%,rgba(255,255,255,.05) 62%,rgba(255,255,255,.55) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.glass::after{ /* pointer highlight */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;opacity:0;
  background:radial-gradient(120px circle at var(--mx) var(--my),rgba(255,255,255,.55),rgba(255,255,255,0) 60%);
  transition:opacity .25s ease;
}
.glass.live:hover::after,.glass.live.pressed::after{opacity:1}
.glass > *{position:relative;z-index:2}
.glass.green{
  --tint:rgba(52,199,89,.82);
  --rim-a:rgba(255,255,255,.75);--rim-b:rgba(255,255,255,.12);
  color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 60%),var(--tint);
  box-shadow:inset 0 -1px 1.5px rgba(0,60,20,.18),0 0 0 .5px rgba(0,90,30,.25),0 1px 2px rgba(0,0,0,.08),0 8px 18px -4px rgba(0,0,0,.14);
}
.pill{border-radius:999px}
/* responsive feel: springy press, gentle lift on hover */
.live{transition:transform .45s cubic-bezier(.3,1.6,.5,1),box-shadow .3s ease;will-change:transform}
.live:hover{transform:scale(1.03)}
.live.pressed{transform:scale(.95);transition-duration:.12s}
.circle{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.circle:focus-visible{outline:2px solid rgba(10,132,255,.6);outline-offset:2px}
.field:focus-within{outline:none}
.circle svg{width:22px;height:22px}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));transition:opacity .35s ease,transform .35s ease}
.screen.out{opacity:0;transform:scale(.985);pointer-events:none}

.bar{display:flex;align-items:center;gap:8px;width:min(402px,100%)}
.field{flex:1;height:48px;display:flex;align-items:center;padding:0 22px;min-width:0}
.field input{flex:1;height:100%}
.field input::placeholder{color:var(--placeholder)}
.note{margin-top:12px;font-size:13px;line-height:18px;color:var(--muted);text-align:center;min-height:18px}
.note.err{color:#D70015}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-3px)}}

/* logo */
.logo{width:120px;height:120px;margin-bottom:40px;filter:drop-shadow(0 10px 16px rgba(0,0,0,.10))}

/* username step */
.appear{opacity:0;transform:scale(.6);width:0;margin-left:-8px;overflow:hidden;transition:all .35s cubic-bezier(.2,.9,.3,1.2)}
.appear.on{opacity:1;transform:none;width:48px;margin-left:0}

/* chat */
#chat{justify-content:flex-start;padding:0}
/* the conversation scrolls underneath the glass countdown and message bar, like iOS */
.count{position:absolute;top:max(28px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:3;height:46px;padding:0 20px;display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{font-weight:500}
#chat .bar{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:3;width:min(402px,calc(100% - 32px))}
.log{position:absolute;inset:0;margin:0 auto;width:min(410px,calc(100% - 24px));overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:104px 4px 100px;scrollbar-width:none}
.log::-webkit-scrollbar{display:none}
.log .spacer{margin-top:auto}
.stamp{align-self:center;font-size:13px;color:var(--muted);margin:6px 0 2px}
.who{font-size:13px;line-height:18px;color:var(--muted);margin:8px 0 -6px 18px}
.bubble{max-width:78%;padding:12px 18px;border-radius:23px;overflow-wrap:anywhere;white-space:pre-wrap;align-self:flex-start;animation:pop .25s ease}
.bubble.mine{align-self:flex-end}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}}
.empty{margin:auto;color:var(--muted);font-size:15px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);padding:10px 18px;font-size:14px;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="toast glass pill" id="toast" hidden></div>

<script type="module">
/* ============ SETTINGS — edit these ============ */
const FIREBASE_CONFIG = { // public web config for the "Playlist Lobby" Firebase project (safe to publish; access is controlled by the security rules)
  apiKey: "AIzaSyAXWr1bW5FljYLu7levh_P6w0rrbdhVToE",
  authDomain: "playlist-lobby.firebaseapp.com",
  projectId: "playlist-lobby",
  storageBucket: "playlist-lobby.firebasestorage.app",
  messagingSenderId: "98113831672",
  appId: "1:98113831672:web:caae55b5c34ba63688310d"
};
const COUNTDOWN_TARGET = "2026-10-31T20:00:00+01:00"; // what the timer counts down to
const COUNTDOWN_LABEL  = "Drop in";
const LOCAL_CODES = ["1","2","3","4","5"]; // only used in offline demo mode (no Firebase)
/* =============================================== */

const $ = id => document.getElementById(id);
const store = { get:k=>{try{return localStorage.getItem(k)}catch{return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}, del:k=>{try{localStorage.removeItem(k)}catch{}} };
const toast = t => { const el=$('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,3200); };


/* ---------- liquid glass: refraction + responsiveness ----------
   Chromium can use an SVG filter as backdrop-filter, which lets us bend
   whatever is behind the glass. We build a displacement map for each element's
   exact size and rebuild it whenever the element resizes (ResizeObserver).
   Other browsers keep the frosted CSS fallback. */
const REFRACT_ENABLED = new URLSearchParams(location.search).has('refract'); // experimental, Chromium only
const REFRACT = REFRACT_ENABLED && !!(navigator.userAgentData && navigator.userAgentData.brands.some(b=>/Chromium|Google Chrome|Microsoft Edge/.test(b.brand)))
  && !matchMedia('(prefers-reduced-transparency: reduce)').matches;
const svgNS="http://www.w3.org/2000/svg";
const defs=(()=>{const s=document.createElementNS(svgNS,'svg');s.setAttribute('width','0');s.setAttribute('height','0');s.style.position='absolute';
  const d=document.createElementNS(svgNS,'defs');s.append(d);document.body.append(s);return d;})();
function dispMap(w,h,r,bezel){
  const dpr=1, c=document.createElement('canvas'); c.width=w*dpr; c.height=h*dpr;
  const g=c.getContext('2d'), img=g.createImageData(c.width,c.height), D=img.data;
  const hw=w/2, hh=h/2; r=Math.min(r,hw,hh);
  for(let y=0;y<c.height;y++)for(let x=0;x<c.width;x++){
    const px=(x+.5)/dpr-hw, py=(y+.5)/dpr-hh, qx=Math.abs(px)-(hw-r), qy=Math.abs(py)-(hh-r);
    let dist, nx, ny;
    if(qx>0&&qy>0){const L=Math.hypot(qx,qy)||1; dist=r-L; nx=qx/L*Math.sign(px); ny=qy/L*Math.sign(py);}
    else if(qx>qy){dist=r-qx; nx=Math.sign(px); ny=0;} else {dist=r-qy; nx=0; ny=Math.sign(py);}
    let m=0; if(dist<bezel&&dist>=0){const t=1-dist/bezel; m=t*t*(3-2*t);} // smooth convex bezel
    const i=(y*c.width+x)*4; D[i]=128-nx*m*127; D[i+1]=128-ny*m*127; D[i+2]=128; D[i+3]=255;
  }
  g.putImageData(img,0,0); return c.toDataURL();
}
let fid=0;
function refract(el){
  if(!REFRACT) return;
  const id='lg'+(++fid), f=document.createElementNS(svgNS,'filter');
  f.id=id; f.setAttribute('color-interpolation-filters','sRGB');
  f.setAttribute('x','0');f.setAttribute('y','0');f.setAttribute('filterUnits','userSpaceOnUse');
  f.innerHTML='<feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b"/><feImage result="m" preserveAspectRatio="none"/>'
   +'<feDisplacementMap in="b" in2="m" scale="28" xChannelSelector="R" yChannelSelector="G" result="d"/>'
   +'<feColorMatrix in="d" type="saturate" values="1.7"/>';
  defs.append(f);
  let last='';
  const build=()=>{const r=el.getBoundingClientRect(), w=Math.round(el.offsetWidth), h=Math.round(el.offsetHeight);
    if(!w||!h) return; const key=w+'x'+h; if(key===last) return; last=key;
    const rad=parseFloat(getComputedStyle(el).borderTopLeftRadius)||0;
    f.setAttribute('width',w);f.setAttribute('height',h);
    const im=f.querySelector('feImage'); im.setAttribute('width',w); im.setAttribute('height',h);
    im.setAttribute('href',dispMap(w,h,Math.min(rad,h/2,w/2),Math.min(18,h/2,w/2)));
    el.style.backdropFilter=el.style.webkitBackdropFilter=`url(#${id}) brightness(1.06)`;
  };
  let t; new ResizeObserver(()=>{clearTimeout(t);t=setTimeout(build,60);}).observe(el); build();
}
function responsive(el){ // pointer-following light + spring press
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();
    el.style.setProperty('--mx',(e.clientX-r.left)+'px');el.style.setProperty('--my',(e.clientY-r.top)+'px');});
  el.addEventListener('pointerdown',()=>el.classList.add('pressed'));
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>el.addEventListener(ev,()=>el.classList.remove('pressed')));
}
document.querySelectorAll('.field,.count,.circle').forEach(refract);
document.querySelectorAll('.live').forEach(responsive);

/* ---------- data layer ---------- */
async function firebaseApi(cfg){
  const V="10.12.2";
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const db = fs.getFirestore(initializeApp(cfg));
  return {
    async checkCode(code){
      const ref = fs.doc(db,"codes",code);
      let snap = await fs.getDoc(ref);
      if(!snap.exists()){
        // codes are whitelisted in the security rules; creating an unknown code is refused
        try{ await fs.setDoc(ref,{username:null}); }catch{ return {valid:false}; }
        snap = await fs.getDoc(ref);
      }
      return {valid:true, username:snap.data().username||null};
    },
    async claim(code,name){
      const lower=name.toLowerCase();
      return fs.runTransaction(db, async tx=>{
        const cRef=fs.doc(db,"codes",code), nRef=fs.doc(db,"usernames",lower);
        const c=await tx.get(cRef), n=await tx.get(nRef);
        if(!c.exists()) throw new Error("code");
        if(c.data().username) return {ok:false, existing:c.data().username};
        if(n.exists()) return {ok:false, taken:true};
        tx.update(cRef,{username:name, claimedAt:fs.serverTimestamp()});
        tx.set(nRef,{code});
        return {ok:true};
      });
    },
    async send(code,username,text){
      await fs.addDoc(fs.collection(db,"messages"),{code,username,text,ts:fs.serverTimestamp()});
    },
    watch(cb){
      const q=fs.query(fs.collection(db,"messages"),fs.orderBy("ts","desc"),fs.limit(150));
      return fs.onSnapshot(q,s=>cb(s.docs.map(d=>{const m=d.data();return {id:d.id,...m,ts:m.ts?m.ts.toMillis():Date.now()}}).reverse()),e=>{console.error(e);toast("Chat connection lost. Reload the page.");});
    }
  };
}
function localApi(){
  // Offline demo: works across tabs in the same browser, nothing is shared with other people.
  const K="playlist-demo", ch=("BroadcastChannel" in window)?new BroadcastChannel(K):null;
  const load=()=>{try{return JSON.parse(store.get(K))||{codes:{},msgs:[]}}catch{return {codes:{},msgs:[]}}};
  const save=d=>{store.set(K,JSON.stringify(d)); ch&&ch.postMessage(1);};
  const subs=new Set(); const emit=()=>{const m=load().msgs.slice(-150); subs.forEach(f=>f(m));};
  ch&&(ch.onmessage=emit); addEventListener("storage",e=>e.key===K&&emit());
  return {
    async checkCode(c){ if(!LOCAL_CODES.includes(c)) return {valid:false}; return {valid:true,username:load().codes[c]||null}; },
    async claim(c,name){ const d=load(); if(d.codes[c]) return {ok:false,existing:d.codes[c]};
      if(Object.values(d.codes).some(n=>n.toLowerCase()===name.toLowerCase())) return {ok:false,taken:true};
      d.codes[c]=name; save(d); return {ok:true}; },
    async send(code,username,text){ const d=load(); d.msgs.push({id:Date.now()+""+Math.random(),code,username,text,ts:Date.now()}); save(d); emit(); },
    watch(cb){ subs.add(cb); cb(load().msgs.slice(-150)); return ()=>subs.delete(cb); }
  };
}

let api;
try{ api = FIREBASE_CONFIG ? await firebaseApi(FIREBASE_CONFIG) : localApi(); }
catch(e){ console.error(e); api = localApi(); toast("Couldn't reach the server. Running in demo mode."); }

/* ---------- navigation ---------- */
let current=$('s-code');
function go(id){
  const next=$(id); if(next===current) return;
  current.classList.add('out'); const prev=current;
  setTimeout(()=>{prev.hidden=true;},350);
  next.hidden=false; requestAnimationFrame(()=>requestAnimationFrame(()=>next.classList.remove('out')));
  current=next;
}
const shake=el=>{el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');};

let me={code:null,username:null};

/* ---------- 1. code ---------- */
$('f-code').addEventListener('submit',async e=>{
  e.preventDefault();
  const code=$('code').value.trim(); const note=$('n-code');
  if(!code) return shake($('f-code'));
  note.className='note'; note.textContent='Checking…';
  try{
    const r=await api.checkCode(code);
    if(!r.valid){ note.className='note err'; note.textContent="That code doesn't work."; shake($('f-code')); $('code').select(); return; }
    me.code=code; store.set('playlist-code',code); note.textContent='';
    if(r.username){ me.username=r.username; openChat(); }
    else { go('s-user'); setTimeout(()=>$('uname').focus(),360); }
  }catch(err){ console.error(err); note.className='note err'; note.textContent="Couldn't check the code. Try again."; }
});

/* ---------- 2. username (lock → next) ---------- */
let locked=false;
$('f-user').addEventListener('submit',async e=>{
  e.preventDefault(); if(locked) return;
  const name=$('uname').value.trim(), note=$('n-user');
  if(!/^[\p{L}\p{N}_.\- ]{2,20}$/u.test(name)){ note.className='note err'; note.textContent='Use 2–20 letters, numbers, spaces, dots, dashes or underscores.'; return shake($('f-user')); }
  $('lock').disabled=true;
  try{
    const r=await api.claim(me.code,name);
    if(r.taken){ note.className='note err'; note.textContent='That username is taken. Pick another.'; shake($('f-user')); return; }
    if(r.existing){ me.username=r.existing; toast(`This code is already ${r.existing}.`); return openChat(); }
    me.username=name; locked=true;
    $('uname').readOnly=true; $('ic-open').hidden=true; $('ic-closed').hidden=false;
    $('lock').setAttribute('aria-label','Username locked');
    note.className='note'; note.textContent=`Locked as ${name}`;
    const nx=$('next'); nx.classList.add('on'); nx.tabIndex=0; setTimeout(()=>nx.focus(),350);
  }catch(err){ console.error(err); note.className='note err'; note.textContent="Couldn't save your username. Try again."; }
  finally{ $('lock').disabled=false; }
});
$('next').addEventListener('click',()=>locked&&openChat());

/* ---------- 3. chat ---------- */
let unwatch=null;
function openChat(){
  go('chat'); startCountdown();
  if(!unwatch) unwatch=api.watch(render);
  setTimeout(()=>$('msg').focus(),360);
}
const fmtTime=t=>new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
const fmtDay=t=>{const d=new Date(t),n=new Date();return (d.toDateString()===n.toDateString()?'Today':d.toLocaleDateString([], {weekday:'short',day:'numeric',month:'short'}))+' '+fmtTime(t);};
function render(list){
  const log=$('log'); const atBottom=log.scrollHeight-log.scrollTop-log.clientHeight<60;
  log.replaceChildren(Object.assign(document.createElement('div'),{className:'spacer'}));
  if(!list.length){ log.append(Object.assign(document.createElement('p'),{className:'empty',textContent:'No messages yet. Say hi.'})); return; }
  let prev=null;
  for(const m of list){
    if(!prev || m.ts-prev.ts>15*60e3) log.append(Object.assign(document.createElement('div'),{className:'stamp',textContent:fmtDay(m.ts)}));
    const mine=m.code===me.code;
    if(!mine && (!prev || prev.code!==m.code)) log.append(Object.assign(document.createElement('div'),{className:'who',textContent:m.username}));
    const b=document.createElement('div'); b.className='bubble glass'+(mine?' mine green':''); b.textContent=m.text; b.title=fmtTime(m.ts);
    log.append(b); prev=m;
  }
  if(atBottom||list.length<14) log.scrollTop=log.scrollHeight;
}
let sending=false;
$('f-msg').addEventListener('submit',async e=>{
  e.preventDefault(); const t=$('msg').value.trim(); if(!t||sending) return;
  sending=true;
  try{ await api.send(me.code,me.username,t); $('msg').value=''; $('log').scrollTop=$('log').scrollHeight; }
  catch(err){ console.error(err); toast("Message not sent. Try again."); }
  finally{ sending=false; }
});

/* ---------- countdown ---------- */
let tick;
function startCountdown(){
  clearInterval(tick); $('c-label').textContent=COUNTDOWN_LABEL;
  const target=new Date(COUNTDOWN_TARGET).getTime(), p=n=>String(n).padStart(2,'0');
  const draw=()=>{ let s=Math.max(0,Math.floor((target-Date.now())/1000));
    $('c-time').textContent=`${p(Math.floor(s/86400))} : ${p(Math.floor(s%86400/3600))} : ${p(Math.floor(s%3600/60))} : ${p(s%60)}`;
    if(s===0){ $('c-label').textContent="It's time"; clearInterval(tick);} };
  draw(); tick=setInterval(draw,1000);
}

/* ---------- resume session ---------- */
const saved=store.get('playlist-code');
if(saved){ api.checkCode(saved).then(r=>{ if(r.valid&&r.username){ me={code:saved,username:r.username}; openChat(); } }).catch(()=>{}); }
</script>
