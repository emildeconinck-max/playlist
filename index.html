<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Playlist</title>
<style>
:root{
  --ground:#D9D9D9;
  --ink:#111;
  --muted:#6E6E73;
  --placeholder:#9A9A9F;
  --green:#34C759;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
  /* the viewer's profile colour (set by JS from their shade) */
  --me:hsl(135,68%,59%);--me-tint:hsla(135,68%,59%,.8);--me-soft:hsla(135,68%,67%,.55);--me-ink:#0E3B1C;
  --spring:cubic-bezier(.25,1.7,.45,1);
  --glass-shadow:
    inset 0 1px 0 rgba(255,255,255,.8),              /* top specular edge */
    inset 0 -1px 1px rgba(0,0,0,.05),                /* lower inner edge */
    inset 0 -12px 18px -14px rgba(255,255,255,.85),  /* light gathering at the bottom, like thick glass */
    inset 0 0 14px rgba(255,255,255,.26),            /* inner glow */
    0 0 0 .5px rgba(0,0,0,.13),                      /* hairline */
    0 1px 2px rgba(0,0,0,.07),
    0 10px 24px -6px rgba(0,0,0,.16);                /* soft lift */
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font:17px/22px var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
input{font:inherit;color:var(--ink);border:0;background:none;outline:none;min-width:0}
[hidden]{display:none!important}

/* ===== Liquid glass material =====
   Layer 1 (element): tint + backdrop blur, or real refraction in Chromium (set by JS)
   Layer 2 (::before): specular rim, brighter where the light hits (top-left)
   Layer 3 (::after):  pointer-following highlight on interactive glass            */
.glass{
  --tint:rgba(255,255,255,.26);
  --rim-a:rgba(255,255,255,.98);
  --rim-b:rgba(255,255,255,.16);
  --mx:30%;--my:0%;
  position:relative;isolation:isolate;
  background:
    linear-gradient(180deg,rgba(255,255,255,.36) 0%,rgba(255,255,255,.04) 58%,rgba(255,255,255,.14) 100%),
    var(--tint);
  -webkit-backdrop-filter:blur(14px) saturate(1.9) brightness(1.05);
  backdrop-filter:blur(14px) saturate(1.9) brightness(1.05);
  box-shadow:var(--glass-shadow);
}
.glass::before{ /* specular rim */
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;z-index:1;
  background:linear-gradient(155deg,var(--rim-a) 0%,var(--rim-b) 38%,rgba(255,255,255,.05) 62%,rgba(255,255,255,.55) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
}
.glass::after{ /* pointer highlight */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;opacity:0;
  background:radial-gradient(120px circle at var(--mx) var(--my),rgba(255,255,255,.55),rgba(255,255,255,0) 60%);
  transition:opacity .25s ease;
}
.glass:hover::after{opacity:.55}
.glass.live:hover::after,.glass.live.pressed::after{opacity:1}
.glass > *{position:relative;z-index:2}
/* tinted glass in a profile colour (bubbles, send button) */
.glass.tinted{
  --rim-a:rgba(255,255,255,.9);--rim-b:rgba(255,255,255,.22);
  background:linear-gradient(180deg,rgba(255,255,255,.32) 0%,rgba(255,255,255,0) 60%,rgba(255,255,255,.1) 100%),var(--tint);
}
/* press ripple */
.rip{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none;z-index:3!important}
.rip i{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,255,255,0) 70%);animation:rip .65s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes rip{to{transform:scale(var(--rs,24));opacity:0}}

/* moving light behind the glass: gives the blur something to bend */
.bg{position:fixed;inset:-12%;z-index:-1;pointer-events:none;transform:translate(var(--px,0),var(--py,0));transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.blob{position:absolute;border-radius:50%;filter:blur(56px);will-change:transform}
.b1{width:58vmax;height:58vmax;left:-6%;top:-12%;background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 68%);animation:d1 24s ease-in-out infinite alternate}
.b2{width:52vmax;height:52vmax;right:-10%;bottom:-14%;background:radial-gradient(circle,var(--me-soft),rgba(255,255,255,0) 70%);animation:d2 30s ease-in-out infinite alternate;transition:background 1s}
.b3{width:44vmax;height:44vmax;left:34%;top:30%;background:radial-gradient(circle,rgba(150,150,158,.42),rgba(150,150,158,0) 70%);animation:d3 36s ease-in-out infinite alternate}
.b4{width:30vmax;height:30vmax;left:8%;bottom:4%;background:radial-gradient(circle,rgba(255,255,255,.8),rgba(255,255,255,0) 70%);animation:d4 28s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(22vw,16vh) scale(1.18)}}
@keyframes d2{to{transform:translate(-24vw,-18vh) scale(.9)}}
@keyframes d3{to{transform:translate(-26vw,12vh) scale(1.25)}}
@keyframes d4{to{transform:translate(30vw,-22vh) scale(1.1)}}

/* staggered entrance when a screen opens */
.screen.enter .stagger{animation:rise .75s cubic-bezier(.2,.9,.25,1.12) both;animation-delay:calc(var(--i,0)*70ms)}
.screen.enter .staggerX{animation:riseX .75s cubic-bezier(.2,.9,.25,1.12) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.96)}}
@keyframes riseX{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
.glass.green{
  --tint:rgba(52,199,89,.82);
  --rim-a:rgba(255,255,255,.75);--rim-b:rgba(255,255,255,.12);
  color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 60%),var(--tint);
  box-shadow:inset 0 -1px 1.5px rgba(0,60,20,.18),0 0 0 .5px rgba(0,90,30,.25),0 1px 2px rgba(0,0,0,.08),0 8px 18px -4px rgba(0,0,0,.14);
}
.pill{border-radius:999px}
/* liquid feel: lift on hover, squash when pressed, wobble back with a spring */
.live{transition:transform .6s var(--spring),box-shadow .3s ease,background .3s,color .3s;will-change:transform}
.live:hover{transform:scale(1.05)}
.live.pressed{transform:scale(1.07,.9);transition:transform .14s ease-out}
.circle{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none}
.circle:focus-visible{outline:2px solid rgba(10,132,255,.6);outline-offset:2px}
.field:focus-within{outline:none}
.circle svg{width:22px;height:22px}

.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));transition:opacity .4s ease,transform .5s cubic-bezier(.2,.9,.3,1)}
.screen.out{opacity:0;transform:scale(.97) translateY(8px);pointer-events:none}

.bar{display:flex;align-items:center;gap:8px;width:min(402px,100%)}
.field{flex:1;height:48px;display:flex;align-items:center;padding:0 22px;min-width:0;transition:transform .55s var(--spring),box-shadow .3s ease}
.field:focus-within{transform:scale(1.02);box-shadow:var(--glass-shadow),0 0 0 4px rgba(255,255,255,.5)}
.field input{flex:1;height:100%}
.field input::placeholder{color:var(--placeholder)}
.note{margin-top:12px;font-size:13px;line-height:18px;color:var(--muted);text-align:center;min-height:18px}
.note.err{color:#D70015}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-3px)}}

/* logo: floats, and tilts towards the pointer */
.logo-wrap{margin-bottom:40px}
.logo-float{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-7px)}}
.logo{display:block;width:120px;height:120px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.12));transform:perspective(700px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .8s cubic-bezier(.2,.9,.3,1.2)}

/* profile colour picker */
.shade{display:flex;align-items:center;gap:12px;height:48px;padding:0 18px;width:min(402px,100%);margin-top:18px}
.shade-lbl{font-size:15px;color:var(--muted);white-space:nowrap}
.shade-dot{width:22px;height:22px;border-radius:50%;flex:none;background:var(--me);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2),inset 0 2px 3px rgba(255,255,255,.6),0 2px 6px rgba(0,0,0,.15);transition:background .15s}
.shade-range{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:30px;background:none;cursor:pointer;margin:0}
.shade-range:focus-visible{outline:none}
.shade-range::-webkit-slider-runnable-track{height:10px;border-radius:999px;background:linear-gradient(90deg,hsl(135,28%,94%),hsl(135,53%,72%),hsl(135,78%,50%));box-shadow:inset 0 0 0 .5px rgba(0,0,0,.16),inset 0 1px 2px rgba(0,0,0,.1)}
.shade-range::-moz-range-track{height:10px;border-radius:999px;background:linear-gradient(90deg,hsl(135,28%,94%),hsl(135,53%,72%),hsl(135,78%,50%));box-shadow:inset 0 0 0 .5px rgba(0,0,0,.16)}
.shade-range::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-8px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,rgba(255,255,255,.8) 55%,rgba(240,240,240,.7));box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 3px 8px rgba(0,0,0,.22),inset 0 -2px 3px rgba(0,0,0,.06);transition:transform .45s var(--spring)}
.shade-range::-moz-range-thumb{width:26px;height:26px;border:0;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,rgba(255,255,255,.8) 55%,rgba(240,240,240,.7));box-shadow:0 0 0 .5px rgba(0,0,0,.2),0 3px 8px rgba(0,0,0,.22);transition:transform .45s var(--spring)}
.shade-range:active::-webkit-slider-thumb,.shade-range:focus-visible::-webkit-slider-thumb{transform:scale(1.3,1.18)}
.shade-range:active::-moz-range-thumb{transform:scale(1.3,1.18)}
.me-color{position:absolute;top:calc(max(28px,env(safe-area-inset-top)) + 5px);right:max(16px,calc(50% - 201px));z-index:3;width:36px;height:36px}
.me-color .shade-dot{width:20px;height:20px}
.shade-pop{position:fixed;z-index:8;top:calc(max(28px,env(safe-area-inset-top)) + 50px);right:max(16px,calc(50% - 201px));width:min(290px,calc(100% - 32px));border-radius:24px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;transform-origin:92% 0;animation:popin .45s var(--spring)}
@keyframes popin{from{opacity:0;transform:scale(.6)}}
.pop-title{margin:0;font-size:13px;color:var(--muted)}
.pop-prev{align-self:flex-end;padding:10px 16px;border-radius:21px;background:var(--me-tint);color:var(--me-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 0 .5px rgba(0,0,0,.1);transition:background .15s,color .15s}

/* username step */
.appear{opacity:0;transform:scale(.6);width:0;margin-left:-8px;overflow:hidden;transition:all .35s cubic-bezier(.2,.9,.3,1.2)}
.appear.on{opacity:1;transform:none;width:48px;margin-left:0}

/* chat */
#chat{justify-content:flex-start;padding:0}
/* the conversation scrolls underneath the glass countdown and message bar, like iOS */
.count{position:absolute;top:max(28px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:3;height:46px;padding:0 22px;display:flex;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{font-weight:700;font-size:19px;letter-spacing:.01em}
.count .u{display:inline-block;min-width:1.25em;text-align:center}
.count .u.tick{animation:tick .5s cubic-bezier(.2,.9,.3,1.3)}
@keyframes tick{from{transform:translateY(-55%) scale(.9);opacity:0}}
/* send button fills with your colour once there is something to send */
#f-msg .send svg{stroke:currentColor;transition:transform .5s var(--spring)}
#f-msg.has-text .send{--tint:var(--me-tint);color:var(--me-ink)}
#f-msg.has-text .send svg{transform:translateY(-1px) scale(1.08)}
.send.launch svg{animation:launch .5s ease}
@keyframes launch{40%{transform:translateY(-16px);opacity:0}41%{transform:translateY(14px);opacity:0}}
#lock.locked{animation:boing .6s var(--spring)}
@keyframes boing{30%{transform:scale(1.2,.85)}60%{transform:scale(.92,1.08)}}
/* subtle log-out × under the countdown */
.logout{position:absolute;top:calc(max(28px,env(safe-area-inset-top)) + 52px);left:50%;transform:translateX(-50%);z-index:3;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:var(--muted);opacity:.7;transition:opacity .2s,background .2s}
.logout:hover,.logout:focus-visible{opacity:1;background:rgba(255,255,255,.45)}
.logout svg{width:12px;height:12px}
/* admin shortcut, only on browsers that have opened the admin panel */
.to-admin{position:absolute;top:calc(max(28px,env(safe-area-inset-top)) + 5px);left:max(16px,calc(50% - 201px));z-index:3;width:36px;height:36px}
.to-admin svg{width:17px;height:17px}
#chat .bar{position:absolute;bottom:max(28px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:3;width:min(402px,calc(100% - 32px))}
.log{position:absolute;inset:0;margin:0 auto;width:min(410px,calc(100% - 24px));overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:118px 4px 100px;scrollbar-width:none}
.log::-webkit-scrollbar{display:none}
.log .spacer{margin-top:auto}
.stamp{align-self:center;font-size:13px;color:var(--muted);margin:6px 0 2px}
.who{font-size:13px;line-height:18px;color:var(--muted);margin:8px 0 -6px 18px;display:flex;align-items:center;gap:6px}
.who i{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.2)}
.bubble{max-width:78%;padding:12px 18px;border-radius:23px;overflow-wrap:anywhere;white-space:pre-wrap;align-self:flex-start;transform-origin:0 100%;transition:transform .5s var(--spring),background .2s,color .2s}
.bubble.mine{align-self:flex-end;transform-origin:100% 100%}
.bubble:hover{transform:scale(1.015)}
.bubble.new{animation:bub .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes bub{from{opacity:0;transform:translateY(12px) scale(.55)}}
.empty{margin:auto;color:var(--muted);font-size:15px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);padding:10px 18px;font-size:14px;z-index:9;animation:toastin .5s var(--spring)}
@keyframes toastin{from{opacity:0;transform:translate(-50%,-14px) scale(.9)}}

/* message the admin writes on everyone's screen */
.announce{position:fixed;left:50%;top:max(28px,env(safe-area-inset-top));transform:translateX(-50%);z-index:4;width:max-content;max-width:min(402px,calc(100% - 32px));padding:12px 20px;border-radius:23px;text-align:center;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:500}
body[data-screen=chat] .announce{top:calc(max(28px,env(safe-area-inset-top)) + 86px)}
.announce.pop{animation:annpop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes annpop{from{opacity:0;transform:translate(-50%,-8px) scale(.96)}}

/* admin panel */
#s-admin{justify-content:flex-start;overflow-y:auto;padding-top:max(28px,env(safe-area-inset-top))}
.admin{width:min(560px,100%);display:flex;flex-direction:column;gap:14px;padding-bottom:40px}
.a-head{display:flex;align-items:center;gap:12px}
.a-head h1{font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.01em;margin:0}
.a-head .a-muted{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-muted{color:var(--muted);font-size:13px;line-height:18px;margin:0}
.a-btn{height:36px;padding:0 16px;border-radius:999px;font-size:15px;font-weight:500;white-space:nowrap;flex:none}
.a-btn.sm{height:30px;padding:0 12px;font-size:13px}
.a-btn.danger{color:#D70015}
.a-btn:disabled{opacity:.4;pointer-events:none}
.bar .a-btn{height:48px}
.card{border-radius:20px;padding:14px 16px}
.a-body{display:flex;flex-direction:column;gap:14px}
.a-panel{display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:4px;padding:4px;height:44px}
.tabs button{flex:1;border-radius:999px;font-size:15px;font-weight:500;color:var(--muted);transition:color .25s}
.tabs button[aria-selected=true],.seg button[aria-checked=true]{color:var(--ink)}
/* sliding selection pill (tabs and filters) */
.glass > .ind{position:absolute;z-index:1;left:0;top:4px;bottom:4px;width:0;border-radius:999px;background:rgba(255,255,255,.85);box-shadow:inset 0 1px 0 #fff,0 1px 3px rgba(0,0,0,.12),0 4px 10px -4px rgba(0,0,0,.12);transition:transform .55s var(--spring),width .45s var(--spring)}
.seg > .ind{top:3px;bottom:3px}
.a-panel:not([hidden]){animation:rise .45s cubic-bezier(.2,.9,.25,1.1)}
.acct{animation:rise .45s cubic-bezier(.2,.9,.25,1.1) both}
.a-stack{display:flex;flex-direction:column;gap:10px}
.a-stack textarea{font:inherit;color:var(--ink);background:none;border:0;outline:none;resize:vertical;min-height:72px;width:100%}
.a-stack textarea::placeholder{color:var(--placeholder)}
.a-row{display:flex;align-items:center;gap:8px}
.a-row .a-muted{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.a-wide{width:100%}
.a-list{display:flex;flex-direction:column;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:26px;line-height:30px;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;line-height:16px;color:var(--muted)}
.gen-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gen-label{font-weight:500}
.stepper{display:flex;align-items:center;height:36px;border-radius:999px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.stepper button{width:34px;height:36px;font-size:20px;line-height:1;color:var(--ink)}
.stepper input{width:36px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;-moz-appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.gen-row .a-btn{margin-left:auto}
.a-in{flex:1;min-width:140px;height:36px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.55);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.a-in::placeholder,.acct input::placeholder{color:var(--placeholder)}
.seg{display:flex;gap:2px;padding:3px;height:36px;flex:none}
.seg button{padding:0 12px;border-radius:999px;font-size:13px;font-weight:500;color:var(--muted);transition:color .25s}
.a-row .seg + .a-btn{margin-left:auto}
.a-empty{text-align:center;padding:12px 0}
.acct{display:flex;align-items:center;gap:12px;padding:12px 14px;flex-wrap:wrap}
.acct.glass.fresh{box-shadow:0 0 0 2px rgba(52,199,89,.55),0 8px 18px -4px rgba(0,0,0,.14)}
.chip{font-weight:700;font-size:14px;letter-spacing:.06em;font-variant-numeric:tabular-nums;background:rgba(0,0,0,.07);padding:7px 10px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:118px}
.chip svg{width:13px;height:13px;opacity:.5}
.chip:hover svg{opacity:.9}
.acct-mid{flex:1;min-width:130px;display:flex;flex-direction:column}
.acct-mid input{font-weight:600;height:24px;padding:0;border-radius:6px;background:none}
.acct-mid input:focus{box-shadow:0 2px 0 -1px var(--ink)}
.acct.free .acct-mid input{font-weight:400}
.acct-acts{display:flex;gap:6px;flex:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:1px}
.acct.free .dot{background:#C7C7CC}
.amsg{display:flex;flex-direction:column;gap:6px}
.amsg.old{opacity:.6}
.amsg-meta{display:flex;align-items:center;gap:8px;font-size:13px;line-height:18px;color:var(--muted)}
.amsg-meta b{color:var(--ink);font-weight:600}
.amsg-meta .grow{flex:1;min-width:0}
.tag{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;background:rgba(0,0,0,.07);padding:2px 8px;border-radius:999px;white-space:nowrap}
.amsg-text{white-space:pre-wrap;overflow-wrap:anywhere}
.dot{transition:background .3s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body data-screen="s-code">
<div class="bg" aria-hidden="true"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i><i class="blob b4"></i></div>

<!-- 1. CODE -->
<section class="screen enter" id="s-code" aria-label="Enter code">
  <div class="logo-wrap stagger" style="--i:0"><div class="logo-float"><svg class="logo" id="logo" viewBox="0 0 180 180" aria-hidden="true">

function dispMap(w,h,r,bezel){

/* ---------- data layer ---------- */
async function firebaseApi(cfg){
  const V="10.12.2";
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const db = fs.getFirestore(initializeApp(cfg));
  const msgOut = d=>{const m=d.data();return {id:d.id,...m,ts:m.ts?m.ts.toMillis():Date.now()}};
  const lost = e=>{console.error(e);toast("Connection lost. Reload the page.");};
  const codeRef = c=>fs.doc(db,"codes",c), nameRef = n=>fs.doc(db,"usernames",n.toLowerCase());
  return {
    async checkCode(code){
      // a code is valid only if the admin has created it
      if(/[\/]/.test(code) || code==="." || code==="..") return {valid:false};
      const snap = await fs.getDoc(codeRef(code));
      return snap.exists() ? {valid:true, username:snap.data().username||null, shade:snap.data().shade} : {valid:false};
    },
    async claim(code,name,shade){
      const lower=name.toLowerCase();
      return fs.runTransaction(db, async tx=>{
        const cRef=fs.doc(db,"codes",code), nRef=fs.doc(db,"usernames",lower);
        const c=await tx.get(cRef), n=await tx.get(nRef);
        if(!c.exists()) throw new Error("code");
        if(c.data().username) return {ok:false, existing:c.data().username};
        if(n.exists()) return {ok:false, taken:true};
        tx.update(cRef,{username:name, claimedAt:fs.serverTimestamp(), shade});
        tx.set(nRef,{code});
        return {ok:true};
      });
    },
    async send(code,username,text,shade){

    },
    setShade(code,shade){ return fs.updateDoc(codeRef(code),{shade}); },
    watch(cb){
      const q=fs.query(fs.collection(db,"messages"),fs.orderBy("ts","desc"),fs.limit(150));
      return fs.onSnapshot(q,s=>cb(s.docs.map(msgOut).reverse()),lost);
    },
    watchCode(code,cb){ return fs.onSnapshot(codeRef(code),s=>cb(s.exists()?(s.data().username||null):undefined),e=>console.error(e)); },
    watchScreen(cb){ return fs.onSnapshot(fs.doc(db,"site","screen"),s=>cb(s.exists()&&s.data().text||""),e=>console.error(e)); },

    /* admin */
    watchAll(cb){
      const q=fs.query(fs.collection(db,"messages"),fs.orderBy("ts","desc"),fs.limit(500));
      return fs.onSnapshot(q,s=>cb(s.docs.map(msgOut)),lost);
    },
    watchCodes(cb){

    },
    createCode(code){ return fs.runTransaction(db,async tx=>{

      tx.set(codeRef(code),{username:null}); return true; }); },
    resetCode(code){ return fs.runTransaction(db,async tx=>{
      const c=await tx.get(codeRef(code)); if(!c.exists()) return;
      const u=c.data().username; if(u) tx.delete(nameRef(u));
      tx.update(codeRef(code),{username:null,claimedAt:null}); }); },
    deleteCode(code){ return fs.runTransaction(db,async tx=>{
      const c=await tx.get(codeRef(code)); if(!c.exists()) return;
      const u=c.data().username; if(u) tx.delete(nameRef(u));
      tx.delete(codeRef(code)); }); },
    renameCode(code,name){ return fs.runTransaction(db,async tx=>{
      const c=await tx.get(codeRef(code)), n=await tx.get(nameRef(name));
      if(!c.exists()) throw new Error("code");
      if(n.exists() && n.data().code!==code) return {ok:false,taken:true};
      const old=c.data().username;
      if(old && old.toLowerCase()!==name.toLowerCase()) tx.delete(nameRef(old));
      tx.set(nameRef(name),{code});
      tx.update(codeRef(code),{username:name,claimedAt:c.data().claimedAt||fs.serverTimestamp()});
      return {ok:true}; }); },
    deleteMessage(id){ return fs.deleteDoc(fs.doc(db,"messages",id)); },
    setScreen(text){ return fs.setDoc(fs.doc(db,"site","screen"),{text,ts:fs.serverTimestamp()}); },
    async clearMessages(){ // delete in batches (a batch holds at most 500 writes)

function localApi(){
  // Offline demo: works across tabs in the same browser, nothing is shared with other people.
  const K="playlist-demo", ch=("BroadcastChannel" in window)?new BroadcastChannel(K):null;
  const load=()=>{ let d=null; try{d=JSON.parse(store.get(K))}catch{}
    d=d||{codes:{},msgs:[]};
    if(!d.v){ d.codes={...Object.fromEntries(LOCAL_CODES.map(c=>[c,null])),...d.codes}; d.v=2; } // seed the demo codes once
    d.msgs=d.msgs||[]; d.screen=d.screen||""; d.shades=d.shades||{}; return d; };
  const subs=new Set(), emit=()=>{const d=load(); subs.forEach(f=>f(d));};
  const save=d=>{store.set(K,JSON.stringify(d)); ch&&ch.postMessage(1); emit();};
  const sub=f=>{subs.add(f); f(load()); return ()=>subs.delete(f);};
  const mut=f=>{const d=load(), r=f(d); save(d); return r;};
  const taken=(d,name,code)=>Object.entries(d.codes).some(([c,n])=>c!==code&&n&&n.toLowerCase()===name.toLowerCase());
  ch&&(ch.onmessage=emit); addEventListener("storage",e=>e.key===K&&emit());
  return {
    async checkCode(c){ const d=load(); return (c in d.codes)?{valid:true,username:d.codes[c],shade:d.shades[c]}:{valid:false}; },
    async claim(c,name,shade){ return mut(d=>{ d.shades[c]=shade; if(!(c in d.codes)) throw new Error("code");
      if(d.codes[c]) return {ok:false,existing:d.codes[c]};
      if(taken(d,name,c)) return {ok:false,taken:true};
      d.codes[c]=name; return {ok:true}; }); },
    async send(code,username,text,shade){ mut(d=>{ d.msgs.push({id:Date.now()+""+Math.random(),code,username,text,shade,ts:Date.now()}); }); },
    async setShade(c,shade){ mut(d=>{ d.shades[c]=shade; }); },
    async clearMessages(){ return mut(d=>{ const n=d.msgs.length; d.msgs=[]; return n; }); },
    watch:cb=>sub(d=>cb(d.msgs.slice(-150))),
    watchCode:(c,cb)=>sub(d=>cb((c in d.codes)?d.codes[c]:undefined)),
    watchScreen:cb=>sub(d=>cb(d.screen)),
    watchAll:cb=>sub(d=>cb(d.msgs.slice().reverse())),
    watchCodes:cb=>sub(d=>cb(Object.entries(d.codes).map(([code,username])=>({code,username,shade:d.shades[code],claimedAt:null})))),
    async createCode(c){ return mut(d=>{ if(c in d.codes) return false; d.codes[c]=null; return true; }); },
    async resetCode(c){ mut(d=>{ if(c in d.codes) d.codes[c]=null; }); },
    async deleteCode(c){ mut(d=>{ delete d.codes[c]; }); },
    async renameCode(c,name){ return mut(d=>{ if(taken(d,name,c)) return {ok:false,taken:true}; d.codes[c]=name; return {ok:true}; }); },
    async deleteMessage(id){ mut(d=>{ d.msgs=d.msgs.filter(m=>m.id!==id); }); },
    async setScreen(text){ mut(d=>{ d.screen=text; }); }
  };
}

  empty.textContent = !list.length ? 'No codes yet. Generate some above.' : codeFilter==='claimed' ? 'No codes are claimed yet.' : 'Every code is claimed. Generate more above.';
  list.forEach((c,i)=>{
    seen.add(c.code); let r=codeRows.get(c.code);
    if(!r){ r=codeRow(c.code); codeRows.set(c.code,r); }
    r.update(c);
    r.el.hidden = !(codeFilter==='all' || (codeFilter==='claimed')===!!c.username);
    if(box.children[i]!==r.el) box.insertBefore(r.el,box.children[i]||null); // only move rows that are out of place (keeps focus while typing)
  });
  for(const [k,r] of codeRows) if(!seen.has(k)){ r.el.remove(); codeRows.delete(k); }
}

/* messages tab */
let adminMsgs=[];
twoStep($('a-clearall'),async()=>{
  try{ const n=await api.clearMessages(); toast(`Cleared ${n} message${n===1?'':'s'}.`); }
  catch(err){ fail('clear the messages')(err); }
});
setInterval(()=>adminOn&&renderAdminMsgs(adminMsgs),60e3);
function renderAdminMsgs(list){
  adminMsgs=list; const box=$('a-msgs'), cutoff=Date.now()-TTL;
  const visible=list.filter(m=>m.ts>cutoff).length;
  $('a-mcount').textContent = `${list.length} message${list.length===1?'':'s'} · ${visible} visible to users (last ${MESSAGE_TTL_HOURS} h)`;
  box.replaceChildren();
  for(const m of list){
    const old=m.ts<=cutoff, row=mk('div','amsg glass card'+(old?' old':'')), meta=mk('div','amsg-meta');
    const d=mk('span','dot'); d.style.background=shadeOf(m.shade).bg;
    meta.append(d, mk('b',null,m.username), mk('span','grow',`code ${m.code} · ${fmtDay(m.ts)}`));
    if(old) meta.append(mk('span','tag','hidden from users'));
    meta.append(twoStep(btn('Delete','danger'),()=>api.deleteMessage(m.id).catch(fail('delete the message'))));
    row.append(meta, mk('div','amsg-text',m.text)); box.append(row);
  }
}

/* ---------- resume session ---------- */
const saved=store.get('playlist-code');
if(saved){ api.checkCode(saved).then(r=>{
  if(!r.valid){ store.del('playlist-code'); return; }
  setMe(saved,r.username,r.shade);
  if(r.username) openChat(); else go('s-user');
}).catch(()=>{}); }
</script>
